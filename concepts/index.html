<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Szkice interakcji na istniejącej mapie · CFAB</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><strong>CFAB 4D Hub × TIMEFLOW</strong><small>Szkice interakcji na obecnej mapie</small></div></div>

    <nav class="mode-nav" aria-label="Wybierz wariant szkicu">

      <div id="sketch-root"></div>
      <section class="explain" aria-label="Opis koncepcji"><div><span class="eyebrow">JEDNA MAPA · TRZY WARSTWY DO SPRAWDZENIA</span><h1 id="explain-title"></h1></div><p id="explain-copy"></p><div id="explain-outcome" class="outcome"></div></section>
    </main>
  </div>
  <script src="./data.js"></script>
  <script src="./app.js"></script>

</html>
